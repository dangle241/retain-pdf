name: English Surface Validation

on:
  push:
    branches: [ review/translated-source-modifications ]
    paths:
      - 'frontend/**'
      - 'frontend-react/**'
      - 'backend/**/*.md'
      - 'doc/**'
      - 'docs/**'
      - 'experiments/**/*.md'
      - 'tools/check-english-surface.mjs'
      - 'tools/translation-english-allowlist.json'
      - '.github/workflows/english-surface.yml'
  pull_request:
    branches: [ review/translated-source-modifications ]
    paths:
      - 'frontend/**'
      - 'frontend-react/**'
      - 'backend/**/*.md'
      - 'doc/**'
      - 'docs/**'
      - 'experiments/**/*.md'
      - 'tools/check-english-surface.mjs'
      - 'tools/translation-english-allowlist.json'
      - '.github/workflows/english-surface.yml'

jobs:
  validate:
    name: Validate English Surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Run English Surface Checker
        run: |
          node tools/check-english-surface.mjs
